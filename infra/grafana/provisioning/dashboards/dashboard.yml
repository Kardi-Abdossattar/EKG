apiVersion: 1

# =============================================================================
# Grafana Dashboard Provisioning
# =============================================================================

providers:
  - name: 'EKG Dashboards'
    orgId: 1
    folder: 'EKG'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
